# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
run-name: ${{ github.actor }} is building 🔧

# Never runs on push or pull request: the Release workflow calls it on the
# commit it is about to tag, and it can be run by hand from the Actions tab.
on:
  workflow_dispatch:
  workflow_call:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Build
        run: go build -v ./...
      - name: Test + CRAP gate
        run: make crap
